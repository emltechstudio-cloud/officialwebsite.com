<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Chat with SEM, EML Tech Studio’s assistant, to explore studio tools, learn skills, discuss project ideas, and find information about EML services.">
    <title>Chat with SEM | EML Tech Studio</title>
  <link rel="canonical" href="https://emltechstudio.space/chatsem.html">

    <link rel="stylesheet" href="/chatsem.css">
      <meta name="keywords" content="EML Tech Studio, Chat SEM, studio tools, skills, project ideas, EML services">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Chat with SEM | EML Tech Studio">
    <meta property="og:description" content="Chat with SEM, EML Tech Studio’s assistant, to explore studio tools, learn skills, discuss project ideas, and find information about EML services.">
    <meta property="og:url" content="https://emltechstudio.space/chatsem.html">
    <meta property="og:site_name" content="EML Tech Studio">
    <meta property="og:image" content="https://emltechstudio.space/semlogo.png">
    <meta property="og:image:alt" content="EML Tech Studio brand image">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Chat with SEM | EML Tech Studio">
    <meta name="twitter:description" content="Chat with SEM, EML Tech Studio’s assistant, to explore studio tools, learn skills, discuss project ideas, and find information about EML services.">
    <meta name="twitter:image" content="https://emltechstudio.space/semlogo.png">
</head>
  <body>
    <header class="header"><a class="brand" href="https://emltechstudio.space/" aria-label="EML Tech Studio home"><img class="brand-logo" src="/ETSlogo.png" alt=""><span><strong>CHAT SEM</strong><small>EML TECH STUDIO</small></span></a><div class="header-tools"><span id="statusDot" class="dot" aria-label="Checking EML service"></span><button id="reset" class="reset" type="button" aria-label="Start a new chat" title="Start a new chat">↻</button></div></header>
    <main><section class="intro"><h1>Chat with SEM</h1><p id="statusText">Connecting to EML.</p></section><section id="thread" class="thread" aria-label="Chat conversation" aria-live="polite"></section><form id="form"><div class="composer"><textarea id="input" rows="2" placeholder="Message SEM…" aria-label="Message SEM"></textarea><button id="voice" class="voice" type="button" aria-label="Start voice input" title="Voice input">⌁</button><button id="send" class="send" type="submit" aria-label="Send message">➤</button></div><p id="hint" class="hint">Type your message. Press Enter to send.</p></form></main><div id="notice" class="notice" hidden role="status"></div>
    <script>
      (()=>{const API='https://emltechstudio-eml-tech-studio-api.hf.space',welcome={id:'sem-welcome',role:'assistant',content:'Hi, I’m SEM. What would you like to explore?'},starters=['Find the right EML tool','I want to learn a skill','I have a project idea','Tell me about EML services'];let messages=[welcome],pending=false,listening=false,speakingId=null,recognition=null;const $=id=>document.getElementById(id),thread=$('thread'),input=$('input'),key=()=>`m-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,note=t=>{const n=$('notice');n.textContent=t;n.hidden=false;clearTimeout(window.noteTimer);window.noteTimer=setTimeout(()=>n.hidden=true,3600)},resize=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,186)+'px'},scroll=()=>window.setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),30);
      const speak=(message,button)=>{if(!('speechSynthesis'in window))return note('Audio playback is not available in this browser.');if(speakingId===message.id){speechSynthesis.cancel();speakingId=null;button.classList.remove('active');button.textContent='♬ Listen';return}speechSynthesis.cancel();document.querySelectorAll('.listen').forEach(x=>{x.classList.remove('active');x.textContent='♬ Listen'});const u=new SpeechSynthesisUtterance(message.content);u.rate=.96;u.onend=()=>{speakingId=null;button.classList.remove('active');button.textContent='♬ Listen'};speakingId=message.id;button.classList.add('active');button.textContent='■ Stop';speechSynthesis.speak(u)};
      const makeSuggestions=(list,initial=false)=>{const wrap=document.createElement('div');wrap.className='suggestions'+(initial?' initial':'');list.forEach(item=>{const action=typeof item==='string'?{label:item}:item;const b=document.createElement('button');b.type='button';b.textContent=action.label;b.onclick=()=>{if(action.url)window.open(action.url,'_blank','noopener,noreferrer');else send(action.label)};wrap.append(b)});return wrap};
      const render=()=>{thread.innerHTML='';messages.forEach(message=>{const article=document.createElement('article');article.className='message '+message.role;if(message.role==='assistant'){const tag=document.createElement('div');tag.className='sem-label';tag.textContent='SEM';article.append(tag)}const body=document.createElement('div');body.className='content';const p=document.createElement('p');p.textContent=message.content;body.append(p);if(message.role==='assistant'){const tools=document.createElement('div');tools.className='message-tools';const listen=document.createElement('button');listen.className='listen';listen.type='button';listen.textContent='♬ Listen';listen.onclick=()=>speak(message,listen);tools.append(listen);if(message.intent){const intent=document.createElement('span');intent.className='intent';intent.textContent=String(message.intent).replaceAll('_',' ');tools.append(intent)}body.append(tools);if(Array.isArray(message.sources)&&message.sources.length){const sources=document.createElement('div');sources.className='sources';message.sources.forEach(source=>{const a=document.createElement('a');a.href=source.url;a.target='_blank';a.rel='noreferrer';a.textContent=source.title+' ↗';sources.append(a)});body.append(sources)}if(Array.isArray(message.quick_actions)&&message.quick_actions.length)body.append(makeSuggestions(message.quick_actions));if(Array.isArray(message.quickActions)&&message.quickActions.length)body.append(makeSuggestions(message.quickActions));if(message.followUp){const f=document.createElement('p');f.className='follow-up';f.textContent=message.followUp;body.append(f)}}article.append(body);thread.append(article)});if(messages.length===1&&!pending)thread.append(makeSuggestions(starters,true));if(pending){const thinking=document.createElement('div');thinking.className='thinking';thinking.innerHTML='<span class="spinner"></span><span>SEM is thinking…</span>';thread.append(thinking)}scroll()};
      const stopVoice=()=>{if(recognition)recognition.abort();recognition=null;listening=false;$('voice').classList.remove('listening');$('voice').setAttribute('aria-label','Start voice input')};const startVoice=()=>{if(listening)return stopVoice();const Ctor=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Ctor)return note('Voice input is not available in this browser. You can still type your message.');const initialText=input.value.trim();recognition=new Ctor();recognition.lang='en-NG';recognition.continuous=false;recognition.interimResults=true;recognition.onresult=e=>{let transcript='';for(let i=0;i<e.results.length;i++)transcript+=e.results[i][0].transcript+' ';input.value=[initialText,transcript.trim()].filter(Boolean).join(initialText&&transcript.trim()?' ':'');resize()};recognition.onerror=e=>{if(e.error!=='aborted')note('SEM could not hear that. Please try again or type your message.');stopVoice()};recognition.onend=stopVoice;listening=true;$('voice').classList.add('listening');$('voice').setAttribute('aria-label','Stop voice input');note('Listening. Speak naturally, then review the text before sending.');try{recognition.start()}catch(e){stopVoice();note('Voice input could not start. Please check microphone access.')}};
      async function send(raw){const text=(raw||input.value).trim();if(!text||pending)return;if(listening)stopVoice();messages.push({id:key(),role:'user',content:text});input.value='';resize();pending=true;render();try{const r=await fetch(API+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,conversationHistory:messages.slice(0,-1).map(m=>({role:m.role,content:m.content}))})});if(!r.ok)throw Error();const p=await r.json();messages.push({id:key(),role:'assistant',content:String(p.response||'I could not prepare an answer just now.'),intent:typeof p.intent==='string'?p.intent:undefined,followUp:typeof p.follow_up==='string'?p.follow_up:undefined,sources:Array.isArray(p.sources)?p.sources:[],quickActions:Array.isArray(p.quick_actions)?p.quick_actions:[]});$('statusDot').className='dot ready';$('statusDot').setAttribute('aria-label','EML service available');$('statusText').textContent='Online and ready to help.'}catch(e){messages.push({id:key(),role:'assistant',content:'I’m having trouble reaching the EML Tech Studio service right now. Please try again in a moment.'});$('statusDot').className='dot offline';$('statusText').textContent='Reconnecting to EML.'}finally{pending=false;render();input.focus()}}
      $('form').addEventListener('submit',e=>{e.preventDefault();send()});input.addEventListener('input',resize);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('reset').onclick=()=>{speechSynthesis.cancel();stopVoice();messages=[welcome];pending=false;input.value='';resize();render();input.focus()};$('voice').onclick=startVoice;const voiceSupported=Boolean(window.SpeechRecognition||window.webkitSpeechRecognition);if(!voiceSupported)$('voice').disabled=true;else $('hint').textContent='Use voice or type your message. Press Enter to send.';resize();render();fetch(API+'/health').then(r=>{if(!r.ok)throw Error();$('statusDot').className='dot ready';$('statusDot').setAttribute('aria-label','EML service available');$('statusText').textContent='Online and ready to help.';return fetch(API+'/apps')}).catch(()=>{$('statusDot').className='dot offline';$('statusText').textContent='Reconnecting to EML.'})
      })();
    </script>
  </body>
</html>
